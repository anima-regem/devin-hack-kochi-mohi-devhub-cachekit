[project]
name = "cachekit-demo"
version = "0.1.0"
description = "Reproducible helpdesk traffic for cachekit"
requires-python = ">=3.12"
dependencies = ["cachekit==0.1.0"]

[project.scripts]
cachekit-demo = "demo_app.traffic:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["demo_app*"]
exclude = ["demo_app.tests*"]

[tool.setuptools.package-data]
"demo_app.helpdesk" = ["policy.txt"]

[tool.uv.workspace]
members = ["engine"]

[tool.uv.sources]
cachekit = { workspace = true }

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.15,<0.16", "httpx>=0.28,<0.29"]

[tool.pytest.ini_options]
testpaths = ["engine/tests", "demo_app/tests"]
pythonpath = ["engine", "."]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".tools", "data", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
